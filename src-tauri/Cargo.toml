[package]
name = "onework"
version = "0.1.0"
description = "AI-powered desktop automation assistant"
authors = ["OneWork"]
edition = "2021"

[lib]
name = "onework_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
